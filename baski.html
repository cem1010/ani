<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ikon.svg">
<title>Anı Baskı</title>
<style>
  :root { --bg:#111; --kart:#1c1c1e; --yazi:#f2f2f2; --soluk:#9a9a9f; --vurgu:#ffb020; --iyi:#3ecf6e; --kotu:#ff5a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--yazi); font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif; padding:12px 12px 90px; }
  h1 { font-size:20px; margin:4px 0 12px; display:flex; align-items:center; gap:8px; }
  .kart { background:var(--kart); border-radius:14px; padding:12px; margin-bottom:12px; }
  .satir { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; border:0; border-radius:12px; padding:14px 16px; background:#2c2c2e; color:var(--yazi); font-weight:600; }
  button.ana { background:var(--vurgu); color:#111; flex:1; font-size:18px; }
  button.genis { width:100%; }
  button:disabled { opacity:.45; }
  .nokta { width:10px; height:10px; border-radius:50%; background:var(--kotu); display:inline-block; }
  .nokta.on { background:var(--iyi); }
  #onizleme { width:100%; max-width:384px; display:block; margin:0 auto; background:#fff; image-rendering:pixelated; border-radius:4px; }
  label { display:block; font-size:14px; color:var(--soluk); margin-top:8px; }
  input[type=range] { width:100%; }
  input[type=text] { width:100%; font:inherit; padding:10px; border-radius:10px; border:1px solid #333; background:#111; color:var(--yazi); }
  select { font:inherit; padding:8px; border-radius:10px; background:#111; color:var(--yazi); border:1px solid #333; }
  .seg { display:flex; gap:6px; margin-top:6px; }
  .seg button { flex:1; padding:10px 6px; font-size:14px; }
  .seg button.sec { background:var(--vurgu); color:#111; }
  #mesaj { position:fixed; left:12px; right:12px; bottom:12px; background:#2c2c2e; padding:12px 14px; border-radius:12px; display:none; z-index:9; }
  #mesaj.goster { display:block; }
  .kucuk { font-size:13px; color:var(--soluk); }
  progress { width:100%; height:8px; }
  details summary { cursor:pointer; color:var(--soluk); }
  #kuyruk { font-size:13px; color:var(--soluk); }
</style>
</head>
<body>
<h1><span id="bagNokta" class="nokta"></span> Anı Baskı <span id="bagAd" class="kucuk"></span></h1>

<div class="kart">
  <div class="satir">
    <button id="bBagla" class="genis">Yazıcıya bağlan</button>
  </div>
  <div id="ydurum" class="kucuk" style="margin-top:6px"></div>
</div>

<div class="kart">
  <div class="satir">
    <button id="bCek" class="ana">📷 Fotoğraf çek</button>
    <button id="bGaleri" title="Galeriden seç">🖼️</button>
  </div>
  <input id="dosyaKamera" type="file" accept="image/*" capture="environment" hidden>
  <input id="dosyaGaleri" type="file" accept="image/*" hidden>
</div>

<div class="kart" id="duzenKart" hidden>
  <canvas id="onizleme"></canvas>
  <div class="seg" id="oranSeg">
    <button data-oran="1">Kare</button><button data-oran="1.333" class="sec">Dikey</button><button data-oran="0.75">Yatay</button><button data-oran="0">Tam</button>
  </div>
  <label>Parlaklık <span id="vParlak"></span></label>
  <input id="rParlak" type="range" min="-0.4" max="0.4" step="0.02" value="0.06">
  <label>Kontrast <span id="vKontrast"></span></label>
  <input id="rKontrast" type="range" min="0.6" max="2" step="0.05" value="1.2">
  <label>Kaydır (kırpma yeri) </label>
  <input id="rKaydir" type="range" min="0" max="1" step="0.01" value="0.5">
  <div class="seg" id="yontemSeg">
    <button data-y="atkinson" class="sec">Yumuşak</button><button data-y="floyd">Detaylı</button><button data-y="esik">Siyah-beyaz</button>
  </div>
  <label><input type="checkbox" id="cQr" checked> Alta QR + yazı ekle</label>
  <div class="satir" style="margin-top:10px">
    <button id="bBas" class="ana">🖨️ Bas</button>
    <button id="bDondur" title="Döndür">⟳</button>
  </div>
  <progress id="ilerleme" value="0" max="1" hidden></progress>
</div>

<div class="kart">
  <div id="kuyruk">Yükleme kuyruğu boş.</div>
</div>

<div class="kart">
  <button id="bTest" class="genis">Test baskısı (yazı + QR)</button>
</div>

<details class="kart">
  <summary>Ayarlar</summary>
  <label>Instagram kullanıcı adı (fotoğraf sayfasında görünür)</label>
  <input id="aIg" type="text" placeholder="ornek_kullanici">
  <label>QR yanındaki yazı (1. satır)</label>
  <input id="aYazi1" type="text">
  <label>QR yanındaki yazı (2. satır)</label>
  <input id="aYazi2" type="text">
  <label>Baskı koyuluğu <span id="vEnerji"></span></label>
  <input id="rEnerji" type="range" min="8000" max="60000" step="1000" value="24000">
  <label>Hız</label>
  <select id="aHiz"><option value="32">Normal (net)</option><option value="16">Hızlı</option><option value="48">Yavaş (en koyu)</option></select>
  <p class="kucuk" id="surum"></p>
</details>

<div id="mesaj"></div>

<script src="lib/qrcode.js"></script>
<script src="lib/yazici.js"></script>
<script src="lib/ani.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const W = YAZICI.GENISLIK;
const yazici = new YAZICI.Yazici();
const ayar = Object.assign({
  ig: '', yazi1: 'Bu anın dijital hali', yazi2: 'QR\'ı okut, indir', enerji: 24000, hiz: 32,
}, JSON.parse(localStorage.getItem('ayar') || '{}'));
const ayarKaydet = () => localStorage.setItem('ayar', JSON.stringify(ayar));

function mesaj(t, ms = 3500) {
  const m = $('mesaj'); m.textContent = t; m.classList.add('goster');
  clearTimeout(mesaj.z); if (ms) mesaj.z = setTimeout(() => m.classList.remove('goster'), ms);
}

// ---- kurulum: #kur=<yükleme anahtarı> (adb ile bir kez açılır, sonra adres temizlenir)
(function kur() {
  const m = location.hash.match(/kur=([A-Za-z0-9_-]{16,})/);
  if (m) { localStorage.setItem('yukleAnahtar', m[1]); history.replaceState(null, '', location.pathname); mesaj('Kurulum tamam ✓'); }
})();

// ---- ayar alanları
$('aIg').value = ayar.ig; $('aYazi1').value = ayar.yazi1; $('aYazi2').value = ayar.yazi2;
$('rEnerji').value = ayar.enerji; $('aHiz').value = ayar.hiz; $('vEnerji').textContent = ayar.enerji;
for (const [id, k] of [['aIg', 'ig'], ['aYazi1', 'yazi1'], ['aYazi2', 'yazi2']])
  $(id).addEventListener('change', () => { ayar[k] = $(id).value.trim().replace(/^@/, ''); ayarKaydet(); ciz(); });
$('rEnerji').addEventListener('input', () => { ayar.enerji = +$('rEnerji').value; $('vEnerji').textContent = ayar.enerji; ayarKaydet(); });
$('aHiz').addEventListener('change', () => { ayar.hiz = +$('aHiz').value; ayarKaydet(); });

// ---- bağlantı
function bagGoster() {
  $('bagNokta').classList.toggle('on', yazici.bagli);
  $('bagAd').textContent = yazici.bagli ? yazici.ad : '';
  $('bBagla').textContent = yazici.bagli ? 'Bağlı ✓ (yeniden bağlan)' : 'Yazıcıya bağlan';
  $('ydurum').textContent = yazici.bagli ? (yazici.durumMetni || 'Hazır') : 'Yazıcıyı aç, sonra "bağlan"a dokun.';
}
async function bagla(secerek = true) {
  if (!navigator.bluetooth) { mesaj('Bu tarayıcıda Bluetooth yok. Chrome ile aç.'); return false; }
  try {
    $('bBagla').disabled = true; $('ydurum').textContent = 'Bağlanıyor…';
    if (!(secerek ? await yazici.sec() : await yazici.oncekiniBul())) { bagGoster(); return false; }
    yazici.cihaz.addEventListener('gattserverdisconnected', bagGoster);
    bagGoster(); return true;
  } catch (e) {
    if (e.name !== 'NotFoundError') mesaj('Bağlanamadı: ' + e.message, 6000);
    bagGoster(); return false;
  } finally { $('bBagla').disabled = false; }
}
$('bBagla').onclick = () => bagla(true);
bagGoster();
bagla(false);
setInterval(() => { if (yazici.bagli) $('ydurum').textContent = yazici.durumMetni || 'Hazır'; }, 2000);

async function bitlerleBas(bitler) {
  if (!yazici.bagli && !(await bagla(false)) && !(await bagla(true))) return false;
  if (yazici.durum & 1) { mesaj('Kâğıt bitmiş görünüyor.', 6000); }
  $('ilerleme').hidden = false; $('ilerleme').value = 0;
  try {
    await yazici.bas(bitler, { hiz: ayar.hiz, enerji: ayar.enerji, ilerleme: (p) => $('ilerleme').value = p });
    return true;
  } catch (e) { mesaj('Baskı hatası: ' + e.message, 7000); return false; }
  finally { setTimeout(() => $('ilerleme').hidden = true, 800); }
}

// ---- fotoğraf
let kaynak = null, oran = 1.333, yontem = 'atkinson', donus = 0, sonKimlik = null;
$('bCek').onclick = () => $('dosyaKamera').click();
$('bGaleri').onclick = () => $('dosyaGaleri').click();
for (const id of ['dosyaKamera', 'dosyaGaleri']) $(id).addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  kaynak = await createImageBitmap(f, { imageOrientation: 'from-image' });
  donus = 0; sonKimlik = null; $('duzenKart').hidden = false; ciz();
  $('duzenKart').scrollIntoView({ behavior: 'smooth' });
});
for (const [seg, k] of [['oranSeg', 'oran'], ['yontemSeg', 'y']]) $(seg).addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...$(seg).children].forEach(x => x.classList.toggle('sec', x === b));
  if (k === 'oran') oran = +b.dataset.oran; else yontem = b.dataset.y;
  ciz();
});
for (const id of ['rParlak', 'rKontrast', 'rKaydir', 'cQr']) $(id).addEventListener('input', () => ciz());
$('bDondur').onclick = () => { donus = (donus + 90) % 360; ciz(); };

// döndürülmüş kaynağı tuvale çiz
function donmusKaynak() {
  const c = document.createElement('canvas');
  const yan = donus % 180 !== 0;
  c.width = yan ? kaynak.height : kaynak.width; c.height = yan ? kaynak.width : kaynak.height;
  const x = c.getContext('2d');
  x.translate(c.width / 2, c.height / 2); x.rotate(donus * Math.PI / 180);
  x.drawImage(kaynak, -kaynak.width / 2, -kaynak.height / 2);
  return c;
}

function fotoBitleri() {
  const src = donmusKaynak();
  const h = oran ? Math.round(W * oran) : Math.round(W * src.height / src.width);
  const c = document.createElement('canvas'); c.width = W; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  const hedefOran = h / W, srcOran = src.height / src.width, k = +$('rKaydir').value;
  let sx = 0, sy = 0, sw = src.width, sh = src.height;
  if (srcOran > hedefOran) { sh = src.width * hedefOran; sy = (src.height - sh) * k; }
  else { sw = src.height / hedefOran; sx = (src.width - sw) * k; }
  x.imageSmoothingQuality = 'high';
  x.drawImage(src, sx, sy, sw, sh, 0, 0, W, h);
  const g = YAZICI.griTon(x.getImageData(0, 0, W, h), { parlaklik: +$('rParlak').value, kontrast: +$('rKontrast').value });
  return { bit: YAZICI.titret(g, W, h, yontem), h, kesit: { src, sx, sy, sw, sh } };
}

function ciz() {
  if (!kaynak) return;
  $('vParlak').textContent = (+$('rParlak').value).toFixed(2);
  $('vKontrast').textContent = (+$('rKontrast').value).toFixed(2);
  if (!sonKimlik) sonKimlik = ANI.yeniKimlik();
  const foto = fotoBitleri();
  const alt = $('cQr').checked ? ANI.altBilgi(ANI.baglanti(sonKimlik), ayar) : null;
  const bit = ANI.birlestir([foto.bit, foto.h], alt);
  ANI.onizle($('onizleme'), bit);
  ciz.son = { bit, foto };
}

$('bBas').onclick = async () => {
  if (!ciz.son) return;
  $('bBas').disabled = true;
  try {
    const { bit, foto } = ciz.son;
    const kimlik = sonKimlik;
    if ($('cQr').checked) {
      // önce kuyruğa al (baskı başarısız olsa bile foto kaybolmaz)
      const jpeg = await ANI.renkliJpeg(foto.kesit.src, foto.kesit);
      await ANI.kuyrugaEkle(kimlik, jpeg);
      kuyrukGoster(); ANI.kuyruguIsle(kuyrukGoster);
    }
    if (await bitlerleBas(bit)) {
      mesaj('Basıldı ✓');
      sonKimlik = null; ciz();             // sonraki baskı yeni bağlantı alır
    }
  } catch (e) { mesaj('Hata: ' + e.message, 7000); }
  finally { $('bBas').disabled = false; }
};

$('bTest').onclick = async () => {
  $('bTest').disabled = true;
  try {
    const bit = ANI.testFisi(ayar);
    if (await bitlerleBas(bit)) mesaj('Test baskısı gönderildi ✓');
  } finally { $('bTest').disabled = false; }
};

// ---- kuyruk
async function kuyrukGoster() {
  const l = await ANI.kuyrukListe();
  const bekleyen = l.filter(x => !x.yuklendi).length;
  $('kuyruk').textContent = !l.length ? 'Yükleme kuyruğu boş.' :
    bekleyen ? `☁️ ${bekleyen} fotoğraf yüklenmeyi bekliyor (internet olunca kendiliğinden).` :
      `☁️ Son ${l.length} fotoğrafın hepsi yüklendi ✓`;
  if (!localStorage.getItem('yukleAnahtar')) $('kuyruk').textContent += ' · Yükleme anahtarı kurulmamış.';
}
kuyrukGoster(); ANI.kuyruguIsle(kuyrukGoster);
setInterval(() => ANI.kuyruguIsle(kuyrukGoster), 30000);
addEventListener('online', () => ANI.kuyruguIsle(kuyrukGoster));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
$('surum').textContent = 'Sürüm ' + ANI.SURUM;
</script>
</body>
</html>
